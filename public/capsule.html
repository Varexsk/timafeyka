<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Письмо Тимофею в будущее</title><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/director.css"></head>
<body class="capsule-page"><main><p class="capsule-kicker">ЦИРК ТИМОШИ · ПАМЯТЬ НА ВСЮ ЖИЗНЬ</p><h1>Привет, будущий Тимофей!</h1><p>Когда-нибудь ты прочитаешь, как сильно мы тебя любим уже сегодня.</p>
<form id="letterForm"><label>От кого письмо<input name="name" required maxlength="80" autocomplete="name" placeholder="Например, бабушка Оля"></label><label>Что ты хочешь пожелать Тимофею?<textarea name="wish" required maxlength="2000" rows="6" placeholder="Дорогой Тимоша…"></textarea></label><label>Твоё предсказание — по желанию<textarea name="prediction" maxlength="1000" rows="3" placeholder="Чем будешь увлекаться? Какое слово скажешь следующим?"></textarea></label><button type="submit">Сохранить письмо</button></form><p id="letterStatus" role="status">Подключаемся…</p><button id="another" hidden>Написать от другого гостя</button><p class="capsule-note">Письмо увидит ведущий. Оно сохранится в семейном альбоме и не появится на общем экране автоматически.</p></main><script type="module" src="js/capsule.js"></script></body></html>
